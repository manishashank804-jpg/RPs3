<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>Rock, Paper, Scissors</h1>
        
        <div class="score-board">
            <div class="score">
                <span id="user-score">0</span>
                <p>Player</p>
            </div>
            <div class="score">
                <span id="computer-score">0</span>
                <p>Computer</p>
            </div>
        </div>

        <div class="result-display">
            <p id="game-message">Make your move to start the game!</p>
        </div>

        <div class="choices">
            <button class="choice-btn" onclick="playGame('rock')">🪨<br>Rock</button>
            <button class="choice-btn" onclick="playGame('paper')">📄<br>Paper</button>
            <button class="choice-btn" onclick="playGame('scissors')">✂️<br>Scissors</button>
        </div>

        <button class="reset-btn" onclick="resetGame()">Reset Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
